name: forecast

on:
  schedule:
    - cron: '0 15 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chronos-bolt-small-v1

      - name: Install libraries
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install chronos-forecasting requests

      - name: Run forecast
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          USER_ID: ${{ secrets.USER_ID }}
        run: python scripts/forecast.py

      - name: Commit result
        run: |
          git config user.name  "forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/forecasts.json
          git diff --staged --quiet || git commit -m "forecast $(date -u +%Y-%m-%d)"
          git push
